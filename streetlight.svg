<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="sidewalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Twilight Sky -->
  <rect width="600" height="320" fill="url(#nightSky)"/>
  <!-- Distant city silhouettes -->
  <rect x="50" y="240" width="60" height="80" fill="#0b132b" opacity="0.6"/>
  <rect x="130" y="210" width="80" height="110" fill="#0b132b" opacity="0.5"/>
  <rect x="420" y="220" width="70" height="100" fill="#0b132b" opacity="0.5"/>
  <rect x="500" y="250" width="60" height="70" fill="#0b132b" opacity="0.6"/>

  <!-- Sidewalk -->
  <rect y="320" width="600" height="80" fill="url(#sidewalk)"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#64748b" stroke-width="3"/>

  <!-- Streetlight Pole & Fixture -->
  <g transform="translate(260, 40)">
    <!-- Base -->
    <path d="M25 290 L10 320 H70 L55 290 Z" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <rect x="32" y="70" width="16" height="220" fill="#64748b" stroke="#334155" stroke-width="2"/>

    <!-- Curved Neck -->
    <path d="M40 70 C40 20 110 10 130 50" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>

    <!-- Broken/Dangling Fixture -->
    <!-- Dangling wire -->
    <path d="M125 55 Q135 75 140 85" stroke="#ef4444" stroke-width="3" fill="none"/>
    <path d="M130 55 Q125 72 133 83" stroke="#facc15" stroke-width="3" fill="none"/>
    <path d="M135 55 Q145 70 148 88" stroke="#3b82f6" stroke-width="3" fill="none"/>

    <!-- Lamp Housing hanging crookedly -->
    <g transform="translate(135, 80) rotate(35)">
      <path d="M-25 0 L25 0 L18 25 L-18 25 Z" fill="#334155" stroke="#1e293b" stroke-width="2"/>
      <!-- Smashed glass bulb -->
      <ellipse cx="0" cy="25" rx="14" ry="10" fill="#94a3b8" opacity="0.4"/>
      <!-- Cracked glass lines -->
      <line x1="-8" y1="20" x2="6" y2="30" stroke="#f8fafc" stroke-width="2"/>
      <line x1="2" y1="18" x2="-4" y2="32" stroke="#f8fafc" stroke-width="1.5"/>
      <!-- Broken glass shards falling -->
      <polygon points="5,40 10,48 2,46" fill="#cbd5e1" opacity="0.8"/>
      <polygon points="-8,45 -3,52 -10,55" fill="#cbd5e1" opacity="0.8"/>
      <polygon points="12,65 16,72 8,70" fill="#cbd5e1" opacity="0.6"/>
    </g>

    <!-- Electrical spark symbols (malfunction) -->
    <path d="M155 70 L165 60 L160 75 L175 68" stroke="#facc15" stroke-width="2" fill="none"/>
    <circle cx="160" cy="72" r="3" fill="#ffffff"/>
  </g>

  <!-- Dark unlit area under the lamp -->
  <ellipse cx="400" cy="350" rx="90" ry="25" fill="#0f172a" opacity="0.5"/>

  <!-- Civic Issue Badge Overlay -->
  <rect x="20" y="20" width="200" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)"/>
  <circle cx="40" cy="38" r="6" fill="#facc15"/>
  <text x="56" y="43" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Broken Streetlight</text>
</svg>
