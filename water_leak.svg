<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pavement" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sprayGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Pavement Base -->
  <rect width="600" height="400" fill="url(#pavement)"/>
  
  <!-- Pavement Curb Edge -->
  <rect x="0" y="240" width="600" height="15" fill="#1e293b"/>
  <rect x="0" y="255" width="600" height="145" fill="#1e293b"/>
  
  <!-- Massive Water Puddle -->
  <path d="M50 280 C120 250, 240 260, 320 270 C420 280, 520 260, 560 310 C580 340, 500 380, 390 385 C260 390, 110 380, 70 340 C40 310, 30 290, 50 280 Z" fill="url(#waterGrad)" opacity="0.8"/>
  <ellipse cx="280" cy="320" rx="180" ry="40" fill="#bae6fd" opacity="0.3"/>

  <!-- Water Ripples -->
  <ellipse cx="270" cy="275" rx="45" ry="12" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>
  <ellipse cx="270" cy="275" rx="80" ry="22" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="270" cy="275" rx="120" ry="32" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>

  <!-- Burst Pipe / Sub-surface opening -->
  <rect x="230" y="240" width="80" height="35" rx="8" fill="#0f172a"/>
  <!-- Exposed blue municipal pipe -->
  <rect x="210" y="250" width="120" height="18" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <!-- Pipe fracture crack -->
  <path d="M265 248 L272 268 L270 258" stroke="#ffffff" stroke-width="3" fill="none"/>

  <!-- High-Pressure Water Geyser / Spout -->
  <path d="M260 250 C250 160, 230 110, 270 70 C310 110, 290 160, 280 250 Z" fill="#7dd3fc" opacity="0.85"/>
  <path d="M265 250 C260 170, 255 120, 270 90 C285 120, 280 170, 275 250 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Fine Water Spray Mist -->
  <ellipse cx="270" cy="80" rx="50" ry="40" fill="url(#sprayGrad)"/>
  <ellipse cx="240" cy="120" rx="30" ry="25" fill="url(#sprayGrad)"/>
  <ellipse cx="300" cy="115" rx="35" ry="30" fill="url(#sprayGrad)"/>

  <!-- Water Droplets Flying -->
  <circle cx="210" cy="90" r="4" fill="#e0f2fe"/>
  <circle cx="330" cy="85" r="5" fill="#e0f2fe"/>
  <circle cx="180" cy="140" r="3.5" fill="#bae6fd"/>
  <circle cx="360" cy="130" r="4" fill="#bae6fd"/>
  <circle cx="290" cy="45" r="3" fill="#ffffff"/>
  <circle cx="245" cy="55" r="3" fill="#ffffff"/>

  <!-- Civic Issue Badge Overlay -->
  <rect x="20" y="20" width="180" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)"/>
  <circle cx="40" cy="38" r="6" fill="#0284c7"/>
  <text x="56" y="43" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Water Leakage</text>
</svg>
